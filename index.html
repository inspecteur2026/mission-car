<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حجز سيارة المأمورية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

  <div class="max-w-2xl mx-auto">
    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">برنامج الخرجات الشهرية (واجهة المفتش)</h2>
      
      <form id="bookingForm" class="space-y-4">
        <!-- كتابة اسم المفتش -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">اسم المفتش:</label>
          <input type="text" id="inspectorName" placeholder="أدخل الاسم الكامل للمفتش" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- رقم التأجير -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">رقم التأجير:</label>
          <input type="text" id="rentalNum" placeholder="أدخل رقم التأجير" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- الوجهة -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">الوجهة:</label>
          <input type="text" id="destination" placeholder="أدخل مكان الخرجة" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- تاريخ الخروج المتاح -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ الخروج المتاح:</label>
          <select id="availableDate" required class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">جاري تحميل التواريخ المتاحة...</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 font-bold transition duration-200">
          تأكيد الحجز
        </button>
      </form>

      <div id="alertSuccess" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-800 rounded-md text-center"></div>
    </div>
  </div>

  <script>
    // ضع رابط تطبيق الويب الخاص بـ Google Apps Script بين الكوتيشن
    const GOOGLE_SCRIPT_URL = "ضع_رابط_GOOGLE_APPS_SCRIPT_هنا";

    // توليد أيام الشهر الحالي
    function generateMonthDates() {
      const dates = [];
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        dates.push(`${year}-${mm}-${dd}`);
      }
      return dates;
    }

    // دالة JSONP لطلب البيانات بدون قيود CORS
    function jsonpRequest(url, params, callbackName) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const queryParams = new URLSearchParams(params);
        queryParams.append('callback', callbackName);

        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };

        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject(new Error("خطأ في الاتصال بالخادم"));
        };

        script.src = `${url}?${queryParams.toString()}`;
        document.body.appendChild(script);
      });
    }

    // جلب التواريخ المتاحة
    function loadAvailableDates() {
      const dateSelect = document.getElementById('availableDate');
      dateSelect.innerHTML = '<option value="">جاري تحديث التواريخ المتاحة...</option>';

      jsonpRequest(GOOGLE_SCRIPT_URL, { action: 'getDates' }, 'handleGetDates')
        .then(bookedDates => {
          const allDates = generateMonthDates();
          const available = allDates.filter(d => !bookedDates.includes(d));

          dateSelect.innerHTML = '<option value="">-- اختر تاريخ الخروج --</option>';
          if (available.length === 0) {
            dateSelect.innerHTML = '<option value="">⚠️ جميع تواريخ هذا الشهر محجوزة</option>';
          } else {
            available.forEach(date => {
              const opt = document.createElement('option');
              opt.value = date;
              opt.textContent = date;
              dateSelect.appendChild(opt);
            });
          }
        })
        .catch(err => {
          console.error(err);
          const allDates = generateMonthDates();
          dateSelect.innerHTML = '<option value="">-- اختر تاريخ الخروج --</option>';
          allDates.forEach(date => {
            const opt = document.createElement('option');
            opt.value = date;
            opt.textContent = date;
            dateSelect.appendChild(opt);
          });
        });
    }

    window.addEventListener('DOMContentLoaded', loadAvailableDates);

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const alertDiv = document.getElementById('alertSuccess');
      const dateSelect = document.getElementById('availableDate');
      const selectedDate = dateSelect.value;
      const inspectorVal = document.getElementById('inspectorName').value;
      const rentalVal = document.getElementById('rentalNum').value;
      const destVal = document.getElementById('destination').value;
      
      if (!selectedDate) {
        alert("يرجى اختيار تاريخ متاح.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الحفظ...";

      const params = {
        action: 'addBooking',
        date: selectedDate,
        inspector: inspectorVal,
        rental: rentalVal,
        destination: destVal
      };

      jsonpRequest(GOOGLE_SCRIPT_URL, params, 'handleAddBooking')
        .then(res => {
          if (res && res.status === "success") {
            alertDiv.innerHTML = `✅ <b>تم تسجيل الحجز بنجاح!</b><br>المفتش: ${inspectorVal} | التاريخ: ${selectedDate}`;
            alertDiv.classList.remove('hidden');
            
            // إخفاء التاريخ من القائمة فوراً
            const optionToRemove = dateSelect.querySelector(`option[value="${selectedDate}"]`);
            if (optionToRemove) optionToRemove.remove();

            document.getElementById('bookingForm').reset();
            loadAvailableDates();
          } else {
            alert("حدث خطأ أثناء الحفظ، يرجى المحاولة لاحقاً.");
          }
        })
        .catch(err => {
          alert("حدث خطأ أثناء الاتصال، يرجى المحاولة مرة أخرى.");
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "تأكيد الحجز";
        });
    });
  </script>
</body>
</html>
