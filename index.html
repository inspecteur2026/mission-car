<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حجز سيارة المأمورية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

  <div class="max-w-2xl mx-auto">
    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">برنامج الخرجات الشهرية (واجهة المفتش)</h2>
      
      <form id="bookingForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">اسم المفتش:</label>
          <select id="inspectorName" required class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">-- اختر المفتش --</option>
            <option value="مفتش 1">مفتش 1</option>
            <option value="مفتش 2">مفتش 2</option>
            <option value="مفتش 3">مفتش 3</option>
            <option value="مفتش 4">مفتش 4</option>
            <option value="مفتش 5">مفتش 5</option>
            <option value="مفتش 6">مفتش 6</option>
            <option value="مفتش 7">مفتش 7</option>
            <option value="مفتش 8">مفتش 8</option>
            <option value="مفتش 9">مفتش 9</option>
            <option value="مفتش 10">مفتش 10</option>
            <option value="مفتش 11">مفتش 11</option>
            <option value="مفتش 12">مفتش 12</option>
            <option value="مفتش 13">مفتش 13</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">رقم التأجير:</label>
          <input type="text" id="rentalNum" placeholder="أدخل رقم التأجير" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">الوجهة:</label>
          <input type="text" id="destination" placeholder="أدخل مكان الخرجة" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ الخروج:</label>
          <input type="date" id="availableDate" required class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 font-bold transition duration-200">
          تأكيد الحجز
        </button>
      </form>

      <div id="alertSuccess" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-800 rounded-md text-center"></div>
    </div>
  </div>

  <script>
    // استبدل هذا الرابط بالرابط الخاص بك
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZ9tJESPm65yzKW1LM8176vrnB7qKxrc8z8OIs0HfykTWf1HXgQSw_bu6DrUzStUSXfA/exec";

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const alertDiv = document.getElementById('alertSuccess');
      
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الحفظ...";

      const data = {
        inspector: document.getElementById('inspectorName').value,
        rental: document.getElementById('rentalNum').value,
        destination: document.getElementById('destination').value,
        date: document.getElementById('availableDate').value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(() => {
        alertDiv.innerHTML = `✅ <b>تم تسجيل الحجز بنجاح!</b><br>المفتش: ${data.inspector} | التاريخ: ${data.date}`;
        alertDiv.classList.remove('hidden');
        document.getElementById('bookingForm').reset();
      })
      .catch(() => {
        alert("حدث خطأ أثناء الاتصال، يرجى المحاولة مرة أخرى.");
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "تأكيد الحجز";
      });
    });
  </script>
</body>
</html>
