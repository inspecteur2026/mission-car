<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حجز سيارة المأمورية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- واجهة المفتش -->
    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">برنامج الخرجات الشهرية (واجهة المفتش)</h2>
      
      <form id="bookingForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">اسم المفتش:</label>
          <select id="inspectorName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 bg-white">
            <option value="">جاري التحميل من الخادم...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">رقم التأجير:</label>
          <input type="text" id="rentalNum" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">الوجهة:</label>
          <input type="text" id="destination" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">تاريخ الخروج:</label>
          <select id="availableDates" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 bg-white">
            <option value="">جاري التحميل من الخادم...</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-bold">تأكيد الحجز</button>
      </form>

      <div id="alertSuccess" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-md"></div>
    </div>

    <!-- واجهة المسؤول -->
    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-gray-800 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">واجهة المسؤول</h2>
        <button id="loginBtn" onclick="toggleAdminPanel()" class="bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-700">دخول المسؤول 🔒</button>
      </div>

      <div id="adminPanel" class="hidden space-y-6">
        <div>
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-lg font-semibold">سجل الحجوزات</h3>
            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-md hover:bg-emerald-700 font-medium">تصدير إلى Excel 📥</button>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse border border-gray-200">
              <thead>
                <tr class="bg-gray-100">
                  <th class="border p-2">التاريخ</th>
                  <th class="border p-2">اسم المفتش</th>
                  <th class="border p-2">رقم التأجير</th>
                  <th class="border p-2">الوجهة</th>
                  <th class="border p-2">الحالة</th>
                </tr>
              </thead>
              <tbody id="bookingsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ضع الرابط الخاص بك هنا
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    let bookingsData = [];

    async function loadData() {
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
      const data = await res.json();
      
      // تعبئة المفتشين
      const inspectorSelect = document.getElementById('inspectorName');
      inspectorSelect.innerHTML = '<option value="">-- اختر المفتش --</option>';
      data.inspectors.forEach(name => {
        inspectorSelect.innerHTML += `<option value="${name}">${name}</option>`;
      });

      // تعبئة التواريخ
      const dateSelect = document.getElementById('availableDates');
      dateSelect.innerHTML = '<option value="">-- اختر تاريخ متاح --</option>';
      data.dates.forEach(date => {
        dateSelect.innerHTML += `<option value="${date}">${date}</option>`;
      });

      // تعبئة الجدول
      bookingsData = data.bookings;
      const tbody = document.getElementById('bookingsTable');
      tbody.innerHTML = '';
      data.bookings.forEach(b => {
        tbody.innerHTML += `
          <tr>
            <td class="border p-2">${b[0]}</td>
            <td class="border p-2">${b[1]}</td>
            <td class="border p-2">${b[2]}</td>
            <td class="border p-2">${b[3]}</td>
            <td class="border p-2 text-green-600 font-bold">${b[4]}</td>
          </tr>`;
      });
    }

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الحفظ والإنهاء...";

      const payload = {
        action: "addBooking",
        inspector: document.getElementById('inspectorName').value,
        rental: document.getElementById('rentalNum').value,
        destination: document.getElementById('destination').value,
        date: document.getElementById('availableDates').value
      };

      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const alert = document.getElementById('alertSuccess');
      alert.innerHTML = `✅ تم تسجيل الحجز بنجاح.<br><b>تاريخ الخروج:</b> ${payload.date}`;
      alert.classList.remove('hidden');

      this.reset();
      submitBtn.disabled = false;
      submitBtn.innerText = "تأكيد الحجز";
      loadData();
    });

    function toggleAdminPanel() {
      const pwd = prompt("كلمة مرور المسؤول:");
      if (pwd === "admin123") {
        document.getElementById('adminPanel').classList.remove('hidden');
      } else if (pwd !== null) {
        alert("كلمة المرور غير صحيحة!");
      }
    }

    function exportToExcel() {
      const ws = XLSX.utils.json_to_sheet(bookingsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "الحجوزات");
      XLSX.writeFile(wb, "جدول_الحجوزات.xlsx");
    }

    loadData();
  </script>
</body>
</html>
